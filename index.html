
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <section class="exchange-rates-section py-5 position-relative overflow-hidden text-white" style="background: linear-gradient(135deg, #020b14 0%, #051d3b 100%);">
     <div class="position-absolute top-0 start-0 translate-middle bg-primary opacity-25 rounded-circle" style="width: 400px; height: 400px; filter: blur(80px);"></div>
    
    <div class="container position-relative z-1">
        <div class="row align-items-center g-5">
             <div class="col-lg-4 text-center text-lg-start animate-fade-in">
               <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold text-uppercase mb-3 shadow-sm" style="letter-spacing: 1px;">Live Updates</span>
               <h2 class="fw-extrabold display-5 mb-3 bg-gradient-text text-white">Today's Exchange Rates</h2>
                 <p class="text-white-50 fs-5 mb-4">Real-time global currency fluctuations analyzed every few seconds.</p>
                <a href="#" class="btn-glow px-4 py-3 rounded-pill fw-bold d-inline-flex align-items-center justify-content-center text-decoration-none">
              <span>View All Markets</span> 
                <i class="fas fa-chart-line ms-2 animate-bounce"></i>
                </a>
            </div>    
              <div class="col-lg-8">
                <div class="row g-4 justify-content-center"> 
                     <div class="col-md-4 col-sm-6 flip-card-container">
                        <div class="flip-card">
                              <div class="flip-card-front p-4 rounded-4 d-flex flex-column justify-content-between">
                             <div class="d-flex align-items-center justify-content-between mb-3">
                               <div class="d-flex align-items-center">
                             <img src="https://flagcdn.com" alt="USD" class="rounded-circle me-3 border border-2 border-light-subtle shadow" width="42" height="42">
                                        <div>    
                                             <h5 class="fw-bold mb-0">USD</h5>
                                                      
   </section> 
</body>
</html>
